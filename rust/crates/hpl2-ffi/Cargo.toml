[package]
name = "hpl2-ffi"
version = "0.1.0"
description = "C ABI bridge between the HPL2 C++ engine and its Rust port; builds hpl2_rs.lib"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "hpl2_rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
hpl-ai.workspace = true
hpl-generate.workspace = true
hpl-math.workspace = true
hpl-system.workspace = true
log.workspace = true

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
