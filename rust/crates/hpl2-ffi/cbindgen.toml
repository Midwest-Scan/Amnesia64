language = "C"
cpp_compat = true
include_guard = "HPL2_RS_H"
autogen_warning = "/* Generated by cbindgen from rust/crates/hpl2-ffi (build.rs). Do not edit by hand. */"
header = """/*
 * Copyright © 2009-2020 Frictional Games
 *
 * This file is part of Amnesia: The Dark Descent.
 *
 * Amnesia: The Dark Descent is free software: you can redistribute it and/or modify
 * it under the terms of the GNU General Public License as published by
 * the Free Software Foundation, either version 3 of the License, or
 * (at your option) any later version.
 *
 * C interface of the Rust port of HPL2 (hpl2_rs.lib).
 */"""
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
# HplWChar is u16 or u32 in Rust depending on the platform; in C it is
# simply the platform's wchar_t.
after_includes = """
typedef wchar_t HplWChar;
"""
usize_is_size_t = true
style = "both"
documentation = true
documentation_style = "c99"

[export]
include = ["HplBvExtents", "HplFrustumView", "HplFrustumProjection"]
exclude = ["HplWChar"]

[fn]
args = "auto"
